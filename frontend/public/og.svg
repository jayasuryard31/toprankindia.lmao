<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#1d2126" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c9f24d" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#c9f24d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#08090a" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(80, 74)">
    <rect x="0" y="18" width="7" height="14" rx="2.5" fill="#656e78" />
    <rect x="13" y="9" width="7" height="23" rx="2.5" fill="#9aa3ad" />
    <rect x="26" y="0" width="7" height="32" rx="2.5" fill="#c9f24d" />
    <text x="50" y="26" fill="#f2f4f5" font-size="27" font-weight="600" letter-spacing="-0.5">TopRank</text>
  </g>

  <text x="80" y="300" fill="#f2f4f5" font-size="92" font-weight="600" letter-spacing="-4">The leaderboard</text>
  <text x="80" y="396" fill="#f2f4f5" font-size="92" font-weight="600" letter-spacing="-4">is for sale.</text>

  <text x="80" y="464" fill="#9aa3ad" font-size="30">Bid on your project. Highest bid holds #1.</text>

  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="326" height="62" rx="12" fill="#0d0f11" stroke="#1d2126" />
    <text x="22" y="27" fill="#656e78" font-size="12" letter-spacing="2" font-family="ui-monospace, monospace">CURRENTLY #1</text>
    <text x="22" y="50" fill="#f2f4f5" font-size="17" font-weight="500">Gaeon</text>
    <text x="304" y="42" fill="#c9f24d" font-size="27" font-weight="600" text-anchor="end" font-family="ui-monospace, monospace">$1,420</text>
  </g>
</svg>
