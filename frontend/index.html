<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090a" />

    <title>TopRank — the leaderboard is for sale</title>
    <meta
      name="description"
      content="Put your project on the board and bid for its rank. The highest bid holds #1 — until someone wants it more."
    />
    <link rel="canonical" href="https://toprankindia.lmao/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social.
         og.svg is the source artwork; rasterise it to og.png at deploy time
         (Slack, X and LinkedIn won't render SVG previews). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TopRank" />
    <meta property="og:url" content="https://toprankindia.lmao/" />
    <meta property="og:title" content="TopRank — the leaderboard is for sale" />
    <meta
      property="og:description"
      content="Put your project on the board and bid for its rank. The highest bid holds #1 — until someone wants it more."
    />
    <meta property="og:image" content="https://toprankindia.lmao/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TopRank — the leaderboard is for sale" />
    <meta
      name="twitter:description"
      content="Bid on your project and climb. Highest bid holds the top spot."
    />
    <meta name="twitter:image" content="https://toprankindia.lmao/og.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
